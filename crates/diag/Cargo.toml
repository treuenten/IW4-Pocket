[package]
name = "diag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Process diagnostics: Channel/Level sinks, JSONL traces, counting allocator."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Apple: the memory, thermal, CPU-clock and thread QoS probes (`health`, and
# the footprint and available memory in `ios_env`).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
